<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 10px 14px; background: #2D2D2D; color: #D8D8D8; font: 9pt "Segoe UI", sans-serif; }
  .row { display: flex; align-items: center; margin: 0 0 10px; }
  .row label { width: 92px; flex: none; color: #969696; }
  select { flex: 1; min-width: 0; background: #3D3D3D; color: #D8D8D8; border: 0; border-radius: 3px; padding: 5px 6px; font: inherit; }
  .note { color: #969696; margin: 2px 0 10px 92px; line-height: 1.4; }
  .off { color: #E7A23E; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="row">
    <label for="mode">When pressed</label>
    <select id="mode">
      <option value="cycle">Go to the next output</option>
      <option value="toggle">Switch between two outputs</option>
    </select>
  </div>
  <div id="pair" class="hidden">
    <div class="row"><label for="a">Output 1</label><select id="a"></select></div>
    <div class="row"><label for="b">Output 2</label><select id="b"></select></div>
  </div>
  <div id="note" class="note"></div>

<script>
  var ws, uuid, action, settings = {}, devices = [], online = true;
  var $ = function (id) { return document.getElementById(id); };

  function connectElgatoStreamDeckSocket(port, inUUID, registerEvent, info, actionInfo) {
    uuid = inUUID;
    var ai = JSON.parse(actionInfo);
    action = ai.action;
    settings = (ai.payload && ai.payload.settings) || {};
    ws = new WebSocket("ws://127.0.0.1:" + port);
    ws.onopen = function () {
      ws.send(JSON.stringify({ event: registerEvent, uuid: uuid }));
      ws.send(JSON.stringify({ event: "sendToPlugin", action: action, context: uuid, payload: { request: "devices" } }));
    };
    ws.onmessage = function (e) {
      var m = JSON.parse(e.data);
      if (m.event === "sendToPropertyInspector" && m.payload) {
        devices = m.payload.devices || [];
        online = m.payload.online !== false;
        render();
      } else if (m.event === "didReceiveSettings" && m.payload) {
        settings = m.payload.settings || {};
        render();
      }
    };
    render();
  }

  function fill(sel, value) {
    sel.innerHTML = "";
    var found = false;
    devices.forEach(function (d) {
      var o = document.createElement("option");
      o.value = d.id; o.textContent = d.name;
      if (d.id === value) { o.selected = true; found = true; }
      sel.appendChild(o);
    });
    if (value && !found) {
      var o = document.createElement("option");
      o.value = value; o.textContent = "(hidden or unplugged)"; o.selected = true;
      sel.appendChild(o);
    }
  }

  function render() {
    var toggle = settings.mode === "toggle";
    $("mode").value = toggle ? "toggle" : "cycle";
    $("pair").className = toggle ? "" : "hidden";
    fill($("a"), settings.a);
    fill($("b"), settings.b);
    var note = $("note");
    if (!online || devices.length === 0) {
      note.className = "note off";
      note.textContent = "Start SoundDeck to see your outputs.";
    } else {
      note.className = "note";
      note.textContent = toggle
        ? "Each press flips between these two."
        : "Each press goes to the next output. Hide outputs you don't use on SoundDeck's Settings page.";
    }
  }

  function save() {
    if (!ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ event: "setSettings", context: uuid, payload: settings }));
  }

  $("mode").onchange = function () {
    settings.mode = this.value;
    if (settings.mode === "toggle" && devices.length > 0) {
      // Start with two real devices rather than System default.
      var real = devices.filter(function (d) { return d.id !== "-"; });
      if (!settings.a) settings.a = (real[0] || devices[0]).id;
      if (!settings.b) settings.b = (real[1] || devices[1] || devices[0]).id;
    }
    render(); save();
  };
  $("a").onchange = function () { settings.a = this.value; save(); };
  $("b").onchange = function () { settings.b = this.value; save(); };
</script>
</body>
</html>
